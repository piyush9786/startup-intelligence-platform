name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: startup_test
          POSTGRES_USER: startup
          POSTGRES_PASSWORD: startup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U startup -d startup_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: test-secret
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: startup_test
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: startup
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Check hardened production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-secret-key-1234567890-must-be-long-enough
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_PASSWORD: ci-postgres-password-2026
          NEO4J_PASSWORD: ci-neo4j-password-2026
          MINIO_ACCESS_KEY: ci-minio-admin
          MINIO_SECRET_KEY: ci-minio-secret-2026
        run: python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: |
          cat << 'EOF' > ../.env.production
          POSTGRES_DB=startup_test
          POSTGRES_USER=startup
          POSTGRES_PASSWORD=ci-postgres-password-2026
          DJANGO_SECRET_KEY=ci-secret-key-1234567890-must-be-long-enough
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          DJANGO_CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
          DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=ci-neo4j-password-2026
          MINIO_ACCESS_KEY=ci-minio-admin
          MINIO_SECRET_KEY=ci-minio-secret-2026
          MINIO_BUCKET_RAW=startup-raw
          MINIO_BUCKET_STARTUP_EVIDENCE=startup-evidence
          STARTUP_ADVISOR_RAG_ENABLED=false
          WEB_SEARCH_ENABLED=false
          EOF
      - name: Run production release tasks
        run: docker compose --env-file ../.env.production -f ../docker-compose.prod.yml --profile release run --rm release
      - name: Start production stack
        run: docker compose --env-file ../.env.production -f ../docker-compose.prod.yml up -d --build
      - name: Verify production backend health
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-delay 5 \
            --retry-all-errors \
            -H 'X-Forwarded-Proto: https' \
            http://localhost/api/v1/health/ \
          | python -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          assert payload["status"] == "ok", payload
          assert payload["database"] is True, payload
          '
      - name: Show production logs on failure
        if: failure()
        run: docker compose --env-file ../.env.production -f ../docker-compose.prod.yml logs
      - name: Stop production stack
        if: always()
        run: docker compose --env-file ../.env.production -f ../docker-compose.prod.yml down -v
      - run: pytest
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
