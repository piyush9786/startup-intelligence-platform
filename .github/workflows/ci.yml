name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: startup_test
          POSTGRES_USER: startup
          POSTGRES_PASSWORD: startup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U startup -d startup_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: test-secret
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: startup_test
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: startup
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      PYTHONPATH: .
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: DJANGO_SETTINGS_MODULE=config.settings.production DJANGO_SECRET_KEY=ci-secret-key-1234567890-must-be-long-enough python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: docker compose -f ../docker-compose.prod.yml config
      - run: pytest
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
