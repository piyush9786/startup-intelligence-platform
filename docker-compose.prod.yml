name: startup-intelligence-prod

x-backend-prod-common: &backend-prod-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env.production
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  restart: always

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes:
      - qdrant_prod_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  backend:
    <<: *backend-prod-common
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ml_models_volume:/app/ml_models

  celery-worker:
    <<: *backend-prod-common
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - media_volume:/app/media
      - ml_models_volume:/app/ml_models

  celery-beat:
    <<: *backend-prod-common
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
  qdrant_prod_data:
  static_volume:
  media_volume:
  ml_models_volume:
