[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["migrations", "ci_venv", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"config/settings.py" = ["F401", "F403", "F405"]
