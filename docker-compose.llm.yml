# CPU-first Ollama tuning for a Docker Desktop allocation of roughly
# 16 CPUs and 24 GB RAM. This override is intentionally separate from
# docker-compose.gpu.yml because the NVIDIA container runtime is not
# currently available on the host.
services:
  ollama:
    cpus: "${OLLAMA_CPU_LIMIT:-12.0}"
    mem_limit: "${OLLAMA_MEMORY_LIMIT:-12g}"
    mem_reservation: "${OLLAMA_MEMORY_RESERVATION:-8g}"
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
